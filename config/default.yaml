# config/default.yaml
# Core system defaults

app:
  name: "Dikili Geothermal District Heating Plant"
  location: "Dikili, Izmir, Turkey"
  latitude: 39.0706
  longitude: 26.8905
  version: "v1.0.0 Release Candidate"

scada:
  scan_interval_sec: 2.0
  alarm_check_interval_sec: 1.0
  historian_flush_interval_sec: 10.0
  simulation_mode: true

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  rotation:
    max_bytes: 10485760 # 10 MB
    backup_count: 5
  tracing:
    enable_correlation: true
    enrich_logs: true
    max_context_lifetime_s: 300
    in_memory_buffer_size: 1000

gui:
  theme: "dark"
  fullscreen: false
  width: 1280
  height: 800

connectivity:
  opcua_endpoint: "opc.tcp://localhost:4840"
  modbus_host: "127.0.0.1"
  modbus_port: 502
  mqtt_broker: "mqtt://localhost:1883"

security:
  session_timeout_sec: 900
  max_login_attempts: 3
  password_min_length: 6

performance:
  max_history_size: 500
  cache_limit: 100
  memory_warning_mb: 500.0
  cleanup_interval_s: 300
  historian:
    batch_size: 50
    flush_interval_s: 5.0
    queue_size_limit: 1000
    retention_max_rows: 500000
  rendering:
    max_fps: 10.0
  scheduler:
    warning_threshold_s: 1.5
    tasks:
      alarm_evaluation:
        interval: 1.0
        priority: "HIGH"
        enabled: true
      historian_flush:
        interval: 10.0
        priority: "NORMAL"
        enabled: true
      memory_monitor:
        interval: 300.0
        priority: "LOW"
        enabled: true
  watchdog:
    default_timeout_s: 5.0
    warning_threshold_misses: 2
    failed_threshold_misses: 4
  recovery:
    max_retries: 3
    cooldown_s: 10.0
    backoff_factor: 2.0
  circuit_breaker:
    failure_threshold: 3
    reset_timeout_s: 30.0
    half_open_max_calls: 1
