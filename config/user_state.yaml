app:
  latitude: 39.0706
  location: Dikili, Izmir, Turkey
  longitude: 26.8905
  name: Dikili Geothermal (DEV)
  version: "v1.0.0 Release Candidate"
connectivity:
  modbus_host: 127.0.0.1
  modbus_port: 502
  mqtt_broker: mqtt://localhost:1883
  opcua_endpoint: opc.tcp://localhost:4840
gui:
  fullscreen: false
  height: 800
  theme: dark
  width: 1280
logging:
  date_format: '%Y-%m-%d %H:%M:%S'
  format: '%(asctime)s [%(levelname)s] %(name)s - %(message)s'
  level: DEBUG
  rotation:
    backup_count: 5
    max_bytes: 10485760
scada:
  alarm_check_interval_sec: 1.0
  historian_flush_interval_sec: 10.0
  scan_interval_sec: 2.0
  simulation_mode: true
ui:
  layers:
    ai: true
    alarm: true
    maintenance: true
    pipeline: true
    sensor: true
    thermal: true
